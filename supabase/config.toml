project_id = "ycp-store"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
# The CLI accepts 15 or 17. 16 is not one of them.
major_version = 17

[db.seed]
# The CLI looks for ./seed.sql by default and this project keeps the demo
# catalogue in ./seed/demo.sql, which is why a fresh stack started empty.
# Runs on `supabase db reset` only, so an existing database is left alone.
enabled = true
sql_paths = ["./seed/demo.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
# The hosted store. Pushed to the linked project by `supabase config push`;
# local runs override it with SITE_URL from app/config/dev.json.
site_url = "https://chanpenh.store"
# Every origin an email link may come back to: the hosted store, the local
# dev app (`SITE_URL` in app/config/dev.json), and the native deep link.
additional_redirect_urls = [
  "https://chanpenh.store",
  "http://localhost:8080",
  "chanpenh://",
]
jwt_expiry = 3600
enable_signup = true

# Password accounts are the second way in, next to Google and the emailed code.
#
# These two rules are mirrored by `passwordMinLength` and `passwordProblem` in
# `app/lib/src/data/auth_repository.dart`; Supabase re-checks on every signup and
# password change, while the client copy only drives the hint text — and the two
# must be changed together or the form will promise a rule the server does not
# enforce, or reject a password the server would accept.
minimum_password_length = 8
password_requirements = "lower_upper_letters_digits"

# ---------------------------------------------------------------------------
# Social providers.
#
# Google is the recommended primary sign-in: free, no rate limit, and its
# required scopes (openid, email, profile) are non-sensitive, so there is no
# Google review queue.
#
# Enable for a hosted project with the dashboard (Authentication -> Providers)
# or with the Management API:
#   PATCH /v1/projects/{ref}/config/auth
#   { "external_google_enabled": true,
#     "external_google_client_id": "...",
#     "external_google_secret": "..." }
#
# The app reads /auth/v1/settings at runtime and shows the button only when the
# provider is on, so nothing has to be rebuilt after enabling it.
# ---------------------------------------------------------------------------
[auth.external.google]
# Off, because Google has no sandbox: a real OAuth client is the only way to
# test it. Flip this to true and export the two values below to try it locally
# (the CLI cannot read a bool from the environment — `env(...)` in a boolean
# field is a config parse error, which took the stack down once already):
#   export SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID=...apps.googleusercontent.com
#   export SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET=...
#   supabase stop && supabase start
# Sandbox builds sign in with a code instead (see Env.devAuthEnabled), so local
# work never needs this.
enabled = false
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
skip_nonce_check = false

[auth.email]
enable_signup = true
# Password accounts are the second way in; the emailed code stays as the
# fallback. Confirmations stay off so a local signup returns a session
# immediately instead of waiting on a mailer that is not running.
enable_confirmations = false
otp_length = 6
otp_expiry = 600
# Minimum gap between two emails to the same address. The CLI wants a duration
# string here, not a number.
max_frequency = "1s"

# ---------------------------------------------------------------------------
# Email templates.
#
# The app asks for a six-digit code, but Supabase's stock templates print only
# {{ .ConfirmationURL }} — a link and no code — so a user gets "Your sign-in
# link" and the six-digit field has nothing to accept. Both templates below
# print {{ .Token }}.
#
# content_path is resolved against the repo root and the file is served to the
# auth container over HTTP (GOTRUE_MAILER_TEMPLATES_*), so the path is
# `./supabase/templates/...` even though this config file lives in supabase/.
# Editing a template only needs the auth container re-read (reloading is on);
# adding a new template section needs `supabase stop && supabase start`, since
# the CLI bakes the URL into the container at creation.
#
# The hosted project does not read this file: run `supabase config push` to send
# the subjects and the HTML to the linked project. Check with `supabase config
# diff` — an unpushed project answers "Your sign-in link" and emails an 8-digit
# code that the app's six-digit field cannot take.
# ---------------------------------------------------------------------------
[auth.email.template.magic_link]
subject = "Your Chanpenh sign-in code"
content_path = "./supabase/templates/magic_link.html"

# Only sent while "Confirm email" is on, i.e. enable_confirmations = true.
[auth.email.template.confirmation]
subject = "Confirm your Chanpenh email"
content_path = "./supabase/templates/confirmation.html"

# Password reset. Carries the same six digits as the other two, because the app
# asks for a code and then for the new password.
[auth.email.template.recovery]
subject = "Reset your Chanpenh password"
content_path = "./supabase/templates/recovery.html"

# Hosted projects are capped at 2 emails/hour on the built-in mailer. Locally
# nothing leaves the machine, every message lands in Mailpit on :54324, so the
# cap only gets in the way of testing.
[auth.rate_limit]
email_sent = 100

[storage]
enabled = true
file_size_limit = "5MiB"

[storage.buckets.product-images]
public = true
file_size_limit = "5MiB"
allowed_mime_types = ["image/png", "image/jpeg", "image/webp", "image/avif"]

# ---------------------------------------------------------------------------
# Edge Functions
#
# payway-callback must accept an unauthenticated POST: ABA PayWay calls it
# directly and has no Supabase JWT. The function does not trust the body, it
# re-checks the transaction with ABA before delivering anything.
# ---------------------------------------------------------------------------
[functions.payway-callback]
verify_jwt = false

[functions.payway-init]
verify_jwt = true

[functions.payway-verify]
verify_jwt = true

# Sandbox sign-in only. Refuses every request unless DEV_OTP is set in the
# function environment, which is true on a local stack and nowhere else.
# There is no user to authenticate yet, so it cannot require a JWT.
[functions.dev-signin]
verify_jwt = false

# Telegram posts updates here and has no Supabase JWT. The function authenticates
# them with TELEGRAM_WEBHOOK_SECRET instead.
[functions.telegram-webhook]
verify_jwt = false

# Internal. Protected by TELEGRAM_DISPATCH_SECRET, and by the JWT when it is unset.
[functions.telegram-dispatch]
verify_jwt = true

# Supplier jobs. Both require SUPPLIER_JOB_SECRET, on top of the JWT, because
# they move real money on a third party's account.
[functions.supplier-sync]
verify_jwt = true

[functions.supplier-fulfil]
verify_jwt = true

[analytics]
enabled = false
