name: ycp_store
description: "Chanpenh - Khmer-first digital goods store: game top-ups and gift cards with ABA KHQR checkout."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  cached_network_image: ^3.4.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_web_plugins:
    sdk: flutter
  go_router: ^17.5.0
  google_fonts: ^8.2.1
  http: ^1.6.0
  intl: ^0.20.2
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.18.3
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    # Pre-bundled so google_fonts loads these from the app bundle instead of
    # fetching them from fonts.gstatic.com on first paint. Khmer is the default
    # locale, so that fetch sat on the critical path of every cold load and
    # reflowed the page when it landed.
    #
    # The names are load-bearing: google_fonts resolves a family and weight by
    # looking for an asset whose path *ends with* `<Family>-<Weight>`, so
    # `NotoSansKhmer-Bold.ttf` serves `GoogleFonts.notoSansKhmer(w700: true)`
    # and the `-Regular`/`-Medium`/… suffixes are not cosmetic.
    - assets/google_fonts/
