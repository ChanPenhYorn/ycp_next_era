project_id = "ycp-store"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 16

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = []
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
# Email OTP is the only sign-in path the app uses.
enable_confirmations = false
otp_length = 6
otp_expiry = 600
max_frequency = 60

[storage]
enabled = true
file_size_limit = "5MiB"

[storage.buckets.product-images]
public = true
file_size_limit = "5MiB"
allowed_mime_types = ["image/png", "image/jpeg", "image/webp", "image/avif"]

# ---------------------------------------------------------------------------
# Edge Functions
#
# payway-callback must accept an unauthenticated POST: ABA PayWay calls it
# directly and has no Supabase JWT. The function does not trust the body, it
# re-checks the transaction with ABA before delivering anything.
# ---------------------------------------------------------------------------
[functions.payway-callback]
verify_jwt = false

[functions.payway-init]
verify_jwt = true

[functions.payway-verify]
verify_jwt = true

[analytics]
enabled = false
